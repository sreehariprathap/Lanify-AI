name: lanify-dev
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lanify-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: lanify-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - lanify_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  lanify_db_data:
